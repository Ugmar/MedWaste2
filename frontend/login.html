<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedWaste - Система управления медицинскими отходами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏥 MedWaste</span>
            <span class="text-white">Управление медицинскими отходами</span>
        </div>
    </nav>

    <div class="auth-container">
        <h1 class="auth-title">Вход в систему</h1>
        
        <div id="errorMsg" class="alert-error" style="display:none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="btn btn-success w-100" style="margin-top: 20px;">Войти</button>
        </form>

        <div class="auth-link">
            Нет аккаунта? <a href="register.html">Зарегистрируйтесь</a>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 MedWaste. Система управления медицинскими отходами.</p>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await api.login(username, password);
                if (response.access_token) {
                    api.setToken(response.access_token);
                    localStorage.setItem('user_role', response.role);
                    window.location.href = '/frontend/dashboard.html';
                } else {
                    errorMsg.textContent = 'Ошибка: Неверные учетные данные';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Ошибка при входе: ' + error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
