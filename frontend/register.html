<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MedWaste</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏥 MedWaste</span>
            <span class="text-white">Управление медицинскими отходами</span>
        </div>
    </nav>

    <div class="auth-container">
        <h1 class="auth-title">Регистрация</h1>
        
        <div id="errorMsg" class="alert-error" style="display:none;"></div>
        <div id="successMsg" class="alert-success" style="display:none;"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username" class="form-label">Имя пользователя</label>
                <input type="text" class="form-control" id="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Введите email" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
            </div>

            <div class="form-group">
                <label for="role" class="form-label">Роль</label>
                <select class="form-select" id="role" required>
                    <option value="">Выберите роль</option>
                    <option value="educator">Образователь (ЛПУ)</option>
                    <option value="driver">Водитель</option>
                    <option value="processor">Переработчик</option>
                    <option value="inspector">Инспектор</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100" style="margin-top: 20px;">Зарегистрироваться</button>
        </form>

        <div class="auth-link">
            Уже есть аккаунт? <a href="login.html">Войдите</a>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 MedWaste. Система управления медицинскими отходами.</p>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            try {
                const response = await api.signup({
                    username,
                    email,
                    password,
                    role
                });
                
                successMsg.textContent = 'Регистрация успешна! Перенаправление...';
                successMsg.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                errorMsg.textContent = 'Ошибка при регистрации: ' + error.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
