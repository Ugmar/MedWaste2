<!DOCTYPE html>
<html>
<head>
    <title>API Tester</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>API Tester</h1>
    
    <div class="row">
        <div class="col-md-6">
            <h3>Login</h3>
            <div class="mb-3">
                <input type="text" class="form-control" id="username" placeholder="Username" value="educator_1">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password" value="password123">
            </div>
            <button class="btn btn-primary" onclick="testLogin()">Login</button>
            
            <h3 class="mt-4">Profile</h3>
            <button class="btn btn-info" onclick="testProfile()">Get Profile</button>
        </div>
        
        <div class="col-md-6">
            <h3>Response</h3>
            <pre id="response" style="background: #f4f4f4; padding: 10px; border-radius: 5px; min-height: 300px;"></pre>
        </div>
    </div>
</div>

<script>
let token = localStorage.getItem('api_token');

async function testLogin() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        
        const data = await response.json();
        if (response.ok) {
            token = data.access_token;
            localStorage.setItem('api_token', token);
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        } else {
            document.getElementById('response').textContent = `Error: ${data.detail}`;
        }
    } catch (error) {
        document.getElementById('response').textContent = `Error: ${error.message}`;
    }
}

async function testProfile() {
    if (!token) {
        document.getElementById('response').textContent = 'Please login first';
        return;
    }
    
    try {
        const response = await fetch('/api/auth/profile', {
            headers: {'Authorization': `Bearer ${token}`}
        });
        
        const data = await response.json();
        if (response.ok) {
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        } else {
            document.getElementById('response').textContent = `Error: ${data.detail}`;
        }
    } catch (error) {
        document.getElementById('response').textContent = `Error: ${error.message}`;
    }
}
</script>
</body>
</html>
