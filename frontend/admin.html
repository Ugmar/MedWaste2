<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedWaste Admin</title>
    <style>
      :root { color-scheme: light; --bg:#0b1220; --card:#0f1a30; --text:#e6edf3; --muted:#9fb2c8; --danger:#ff6b6b; --ok:#3fb950; --border:#1f2a44; }
      body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; background:linear-gradient(180deg, var(--bg), #050912); color:var(--text); }
      header { position:sticky; top:0; z-index:10; background:rgba(11,18,32,0.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--border); }
      .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 18px; margin: 0; letter-spacing: 0.2px; }
      .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
      .pill { padding:6px 10px; border:1px solid var(--border); border-radius: 999px; color:var(--muted); font-size: 12px; }
      main { padding: 18px 0 40px; }
      .grid { display:grid; grid-template-columns: 1fr; gap:14px; }
      @media (min-width: 980px) { .grid { grid-template-columns: 1fr 1fr; } }
      .card { background: rgba(15,26,48,0.9); border:1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
      .card h2 { font-size: 14px; margin: 0 0 10px; color: #dbe7f3; }
      label { display:block; font-size: 12px; color: var(--muted); margin: 10px 0 6px; }
      input, select, textarea { width: 100%; box-sizing:border-box; padding: 10px 10px; border-radius: 10px; border:1px solid var(--border); background:#0b1326; color:var(--text); outline:none; }
      textarea { min-height: 80px; resize: vertical; }
      button { border:1px solid var(--border); background:#0b1326; color:var(--text); padding: 10px 12px; border-radius: 10px; cursor:pointer; }
      button.primary { background: linear-gradient(180deg, #1f6feb, #1b59c8); border-color:#1f6feb; }
      button.danger { border-color: rgba(255,107,107,0.4); color: #ffd2d2; }
      button:disabled { opacity: 0.6; cursor:not-allowed; }
      .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px; }
      .divider { height: 1px; background: var(--border); margin: 12px 0; }
      table { width:100%; border-collapse: collapse; font-size: 12px; }
      th, td { border-bottom: 1px solid var(--border); padding: 8px 6px; vertical-align: top; }
      th { text-align:left; color: var(--muted); font-weight:600; }
      .small { font-size: 12px; color: var(--muted); }
      .status { font-size: 12px; }
      .status.ok { color: var(--ok); }
      .status.bad { color: var(--danger); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .right { margin-left:auto; }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap row">
        <h1>MedWaste Admin</h1>
        <span class="pill">UI → /admin.html</span>
        <span class="pill">API → /admin/*</span>
        <span id="status" class="pill status bad right">No token</span>
      </div>
    </header>
    <main class="wrap">
      <div class="card">
        <h2>Login</h2>
        <div class="row">
          <div style="flex:1; min-width: 220px;">
            <label>Username</label>
            <input id="login_username" autocomplete="username" />
          </div>
          <div style="flex:1; min-width: 220px;">
            <label>Password</label>
            <input id="login_password" type="password" autocomplete="current-password" />
          </div>
          <div class="actions" style="align-items:flex-end;">
            <button class="primary" id="btn_login">Get token</button>
            <button id="btn_logout" class="danger">Logout</button>
          </div>
        </div>
        <label>Token (stored in localStorage)</label>
        <input id="token" class="mono" placeholder="Bearer token..." />
        <div class="actions">
          <button id="btn_save_token">Save token</button>
          <button id="btn_check" class="primary">Check /auth/profile</button>
        </div>
        <div id="login_msg" class="small"></div>
      </div>

      <div class="grid" style="margin-top:14px;">
        <section class="card">
          <h2>Organizations</h2>
          <div class="row">
            <button id="org_refresh" class="primary">Refresh</button>
            <span class="small">Create / update / delete organizations</span>
          </div>
          <div class="divider"></div>
          <div class="row">
            <div style="flex:1; min-width: 160px;">
              <label>INN</label>
              <input id="org_inn" />
            </div>
            <div style="flex:1; min-width: 160px;">
              <label>KPP</label>
              <input id="org_kpp" />
            </div>
            <div style="flex:2; min-width: 220px;">
              <label>Name</label>
              <input id="org_name" />
            </div>
          </div>
          <div class="actions">
            <button id="org_create" class="primary">Create</button>
          </div>
          <div class="divider"></div>
          <div style="overflow:auto;">
            <table id="org_table">
              <thead>
                <tr><th>ID</th><th>INN</th><th>KPP</th><th>Name</th><th>Actions</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="org_msg" class="small"></div>
        </section>

        <section class="card">
          <h2>Waste Types</h2>
          <div class="row">
            <button id="wt_refresh" class="primary">Refresh</button>
            <span class="small">CRUD waste types</span>
          </div>
          <div class="divider"></div>
          <div class="row">
            <div style="flex:1; min-width: 170px;">
              <label>Code</label>
              <input id="wt_code" />
            </div>
            <div style="flex:2; min-width: 220px;">
              <label>Name</label>
              <input id="wt_name" />
            </div>
          </div>
          <div class="row">
            <div style="flex:1; min-width: 220px;">
              <label>Waste Class</label>
              <select id="wt_class">
                <option value="class_1">class_1</option>
                <option value="class_2">class_2</option>
                <option value="class_3">class_3</option>
                <option value="class_4">class_4</option>
              </select>
            </div>
            <div style="flex:2; min-width: 220px;">
              <label>Description</label>
              <textarea id="wt_desc"></textarea>
            </div>
          </div>
          <div class="actions">
            <button id="wt_create" class="primary">Create</button>
          </div>
          <div class="divider"></div>
          <div style="overflow:auto;">
            <table id="wt_table">
              <thead>
                <tr><th>ID</th><th>Code</th><th>Name</th><th>Class</th><th>Updated</th><th>Actions</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="wt_msg" class="small"></div>
        </section>

        <section class="card" style="grid-column: 1 / -1;">
          <h2>Users</h2>
          <div class="row">
            <button id="user_refresh" class="primary">Refresh</button>
            <div style="min-width: 260px;">
              <label>Filter by organization_id (optional)</label>
              <input id="user_filter_org" class="mono" placeholder="UUID..." />
            </div>
          </div>
          <div class="divider"></div>
          <div class="row">
            <div style="flex:1; min-width: 180px;">
              <label>Username</label>
              <input id="user_username" />
            </div>
            <div style="flex:1; min-width: 220px;">
              <label>Email</label>
              <input id="user_email" />
            </div>
            <div style="flex:2; min-width: 220px;">
              <label>Full name</label>
              <input id="user_full_name" />
            </div>
          </div>
          <div class="row">
            <div style="flex:1; min-width: 220px;">
              <label>Role</label>
              <select id="user_role">
                <option value="EDUCATOR">EDUCATOR</option>
                <option value="DRIVER">DRIVER</option>
                <option value="PROCESSOR">PROCESSOR</option>
                <option value="INSPECTOR">INSPECTOR</option>
                <option value="ADMIN">ADMIN</option>
              </select>
            </div>
            <div style="flex:2; min-width: 260px;">
              <label>Organization ID</label>
              <input id="user_org_id" class="mono" placeholder="UUID..." />
            </div>
            <div style="flex:1; min-width: 220px;">
              <label>Password</label>
              <input id="user_password" type="password" />
            </div>
          </div>
          <div class="actions">
            <button id="user_create" class="primary">Create</button>
          </div>
          <div class="divider"></div>
          <div style="overflow:auto;">
            <table id="user_table">
              <thead>
                <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Org</th><th>Name</th><th>Actions</th></tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div id="user_msg" class="small"></div>
        </section>
      </div>
    </main>

    <script>
      const API_URL = '/api';
      const $ = (id) => document.getElementById(id);
      const statusEl = $("status");

      function setStatus(ok, text) {
        statusEl.textContent = text;
        statusEl.classList.toggle("ok", ok);
        statusEl.classList.toggle("bad", !ok);
      }

      function getToken() {
        return ($("token").value || "").trim() || localStorage.getItem("medwaste_token") || "";
      }

      function setToken(token) {
        $("token").value = token || "";
        if (token) localStorage.setItem("medwaste_token", token);
        else localStorage.removeItem("medwaste_token");
        setStatus(!!token, token ? "Token set" : "No token");
      }

      async function api(path, opts={}) {
        const token = getToken();
        const headers = Object.assign({}, opts.headers || {});
        if (token) headers["Authorization"] = `Bearer ${token}`;
        if (opts.body && !(opts.body instanceof FormData)) {
          headers["Content-Type"] = "application/json";
        }
        const res = await fetch(API_URL + path, Object.assign({}, opts, { headers }));
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = text; }
        if (!res.ok) {
          const msg = (data && data.detail) ? data.detail : (typeof data === "string" ? data : res.statusText);
          throw new Error(msg || `HTTP ${res.status}`);
        }
        return data;
      }

      function rowActionBtn(label, cls, onClick) {
        const btn = document.createElement("button");
        btn.textContent = label;
        if (cls) btn.className = cls;
        btn.addEventListener("click", onClick);
        return btn;
      }

      function clearMsg(id) { $(id).textContent = ""; }
      function setMsg(id, text) { $(id).textContent = text || ""; }

      async function login() {
        clearMsg("login_msg");
        try {
          const data = await api("/auth/login", {
            method: "POST",
            body: JSON.stringify({ username: $("login_username").value, password: $("login_password").value })
          });
          setToken(data.access_token);
          setMsg("login_msg", "OK");
        } catch (e) {
          setMsg("login_msg", e.message);
        }
      }

      async function checkProfile() {
        clearMsg("login_msg");
        try {
          const me = await api("/auth/profile");
          setMsg("login_msg", `Hello, ${me.username} (${me.role})`);
          setStatus(true, "Token OK");
        } catch (e) {
          setMsg("login_msg", e.message);
          setStatus(false, "Token invalid");
        }
      }

      async function refreshOrganizations() {
        clearMsg("org_msg");
        const tbody = $("org_table").querySelector("tbody");
        tbody.innerHTML = "";
        try {
          const orgs = await api("/admin/organizations?skip=0&limit=200");
          for (const org of orgs) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td class="mono">${org.id}</td><td>${org.inn}</td><td>${org.kpp || ""}</td><td>${org.name}</td><td></td>`;
            const actionsTd = tr.querySelector("td:last-child");
            actionsTd.appendChild(rowActionBtn("Edit", "", async () => {
              const inn = prompt("INN", org.inn);
              if (inn === null) return;
              const kpp = prompt("KPP (empty = null)", org.kpp || "");
              if (kpp === null) return;
              const name = prompt("Name", org.name);
              if (name === null) return;
              await api(`/admin/organizations/${org.id}`, {
                method: "PATCH",
                body: JSON.stringify({
                  inn: inn.trim() || undefined,
                  kpp: (kpp.trim() === "" ? null : kpp.trim()),
                  name: name.trim() || undefined,
                })
              });
              await refreshOrganizations();
            }));
            actionsTd.appendChild(rowActionBtn("Delete", "danger", async () => {
              if (!confirm(`Delete organization ${org.name}?`)) return;
              await api(`/admin/organizations/${org.id}`, { method: "DELETE" });
              await refreshOrganizations();
            }));
            tbody.appendChild(tr);
          }
          setMsg("org_msg", `Loaded: ${orgs.length}`);
        } catch (e) {
          setMsg("org_msg", e.message);
        }
      }

      async function createOrganization() {
        clearMsg("org_msg");
        try {
          await api("/admin/organizations", {
            method: "POST",
            body: JSON.stringify({
              inn: $("org_inn").value,
              kpp: $("org_kpp").value || null,
              name: $("org_name").value
            })
          });
          $("org_inn").value = ""; $("org_kpp").value = ""; $("org_name").value = "";
          await refreshOrganizations();
        } catch (e) {
          setMsg("org_msg", e.message);
        }
      }

      async function refreshWasteTypes() {
        clearMsg("wt_msg");
        const tbody = $("wt_table").querySelector("tbody");
        tbody.innerHTML = "";
        try {
          const items = await api("/admin/waste-types?skip=0&limit=200");
          for (const wt of items) {
            const tr = document.createElement("tr");
            const updated = wt.updated_at ? String(wt.updated_at).replace("T"," ").replace("Z","") : "";
            tr.innerHTML = `<td class="mono">${wt.id}</td><td class="mono">${wt.code}</td><td>${wt.name}</td><td class="mono">${wt.waste_class}</td><td class="mono">${updated}</td><td></td>`;
            const actionsTd = tr.querySelector("td:last-child");
            actionsTd.appendChild(rowActionBtn("Edit", "", async () => {
              const code = prompt("Code", wt.code);
              if (code === null) return;
              const name = prompt("Name", wt.name);
              if (name === null) return;
              const wclass = prompt("Waste class", wt.waste_class);
              if (wclass === null) return;
              const desc = prompt("Description", wt.description || "");
              if (desc === null) return;
              await api(`/admin/waste-types/${wt.id}`, {
                method: "PATCH",
                body: JSON.stringify({
                  code: code.trim() || undefined,
                  name: name.trim() || undefined,
                  waste_class: wclass.trim() || undefined,
                  description: desc.trim() || null
                })
              });
              await refreshWasteTypes();
            }));
            actionsTd.appendChild(rowActionBtn("Delete", "danger", async () => {
              if (!confirm(`Delete waste type ${wt.code}?`)) return;
              await api(`/admin/waste-types/${wt.id}`, { method: "DELETE" });
              await refreshWasteTypes();
            }));
            tbody.appendChild(tr);
          }
          setMsg("wt_msg", `Loaded: ${items.length}`);
        } catch (e) {
          setMsg("wt_msg", e.message);
        }
      }

      async function createWasteType() {
        clearMsg("wt_msg");
        try {
          await api("/admin/waste-types", {
            method: "POST",
            body: JSON.stringify({
              code: $("wt_code").value,
              name: $("wt_name").value,
              waste_class: $("wt_class").value,
              description: $("wt_desc").value || null
            })
          });
          $("wt_code").value = ""; $("wt_name").value = ""; $("wt_desc").value = "";
          await refreshWasteTypes();
        } catch (e) {
          setMsg("wt_msg", e.message);
        }
      }

      async function refreshUsers() {
        clearMsg("user_msg");
        const tbody = $("user_table").querySelector("tbody");
        tbody.innerHTML = "";
        try {
          const org = $("user_filter_org").value.trim();
          const q = org ? `?organization_id=${encodeURIComponent(org)}&skip=0&limit=300` : "?skip=0&limit=300";
          const users = await api(`/admin/users${q}`);
          for (const u of users) {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td class="mono">${u.id}</td><td>${u.username}</td><td>${u.email}</td><td class="mono">${u.role}</td><td class="mono">${u.organization_id || ""}</td><td>${u.full_name}</td><td></td>`;
            const actionsTd = tr.querySelector("td:last-child");
            actionsTd.appendChild(rowActionBtn("Edit", "", async () => {
              const email = prompt("Email", u.email);
              if (email === null) return;
              const full_name = prompt("Full name", u.full_name);
              if (full_name === null) return;
              const role = prompt("Role", u.role);
              if (role === null) return;
              const organization_id = prompt("Organization ID", u.organization_id || "");
              if (organization_id === null) return;
              const password = prompt("New password (empty = no change)", "");
              if (password === null) return;
              const payload = {
                email: email.trim() || undefined,
                full_name: full_name.trim() || undefined,
                role: role.trim() || undefined,
                organization_id: organization_id.trim() ? organization_id.trim() : undefined,
              };
              if (password.trim()) payload.password = password;
              await api(`/admin/users/${u.id}`, {
                method: "PATCH",
                body: JSON.stringify(payload)
              });
              await refreshUsers();
            }));
            actionsTd.appendChild(rowActionBtn("Delete", "danger", async () => {
              if (!confirm(`Delete user ${u.username}?`)) return;
              await api(`/admin/users/${u.id}`, { method: "DELETE" });
              await refreshUsers();
            }));
            tbody.appendChild(tr);
          }
          setMsg("user_msg", `Loaded: ${users.length}`);
        } catch (e) {
          setMsg("user_msg", e.message);
        }
      }

      async function createUser() {
        clearMsg("user_msg");
        try {
          await api("/admin/users", {
            method: "POST",
            body: JSON.stringify({
              username: $("user_username").value,
              email: $("user_email").value,
              full_name: $("user_full_name").value,
              role: $("user_role").value,
              organization_id: $("user_org_id").value || null,
              password: $("user_password").value
            })
          });
          $("user_username").value = ""; $("user_email").value = ""; $("user_full_name").value = ""; $("user_org_id").value = ""; $("user_password").value = "";
          await refreshUsers();
        } catch (e) {
          setMsg("user_msg", e.message);
        }
      }

      $("btn_login").addEventListener("click", login);
      $("btn_logout").addEventListener("click", () => { setToken(""); setMsg("login_msg","Logged out"); });
      $("btn_save_token").addEventListener("click", () => setToken($("token").value.trim()));
      $("btn_check").addEventListener("click", checkProfile);

      $("org_refresh").addEventListener("click", refreshOrganizations);
      $("org_create").addEventListener("click", createOrganization);

      $("wt_refresh").addEventListener("click", refreshWasteTypes);
      $("wt_create").addEventListener("click", createWasteType);

      $("user_refresh").addEventListener("click", refreshUsers);
      $("user_create").addEventListener("click", createUser);

      setToken(localStorage.getItem("medwaste_token") || "");
    </script>
  </body>
</html>
